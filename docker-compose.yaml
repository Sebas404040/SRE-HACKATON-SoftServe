version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: agentx_backend
    ports:
      - "3001:3001"
    env_file:
      - .env.example
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: agentx_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start